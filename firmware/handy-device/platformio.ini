; ============================================================
; QuickRescue Handy Device — PlatformIO Project Configuration
; Target    : ESP32-WROOM-32 (Dual Core, 240 MHz)
; Framework : Arduino (ESP-IDF 4.x bundled)
; ============================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, colorize

; Build flags
; -D QR_SELFTEST  : Uncomment to run protocol self-test in setup() and halt.
;                   REMOVE for production builds.
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DQR_DEVICE_ID=0x0042
    ; -DQR_SELFTEST

; Project source / include paths
; '../../protocol' exposes codec_reference.h to the firmware
build_src_filter = +<*> -<.git/> -<.svn/>
include_path     = include

; Third-party libraries
lib_deps =
    sandeepmistry/LoRa               @ ^0.8.0
    mikalhart/TinyGPSPlus            @ ^1.0.3
    electroniccats/MPU6050           @ ^1.3.1
    adafruit/Adafruit SSD1306        @ ^2.5.9
    adafruit/Adafruit GFX Library    @ ^1.11.9
